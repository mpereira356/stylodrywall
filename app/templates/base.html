<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Stylo Drywall{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='css/app.css')}}">{% block head %}{% endblock %}</head><body>{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="toast-stack">{% for c,m in messages %}<div class="notice {{c}}">{{m}}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block body %}{% endblock %}<script src="{{url_for('static',filename='js/app.js')}}"></script>{% block scripts %}{% endblock %}</body></html>
