{% extends 'base.html' %}
{% block title %}Login | Stylo Drywall{% endblock %}
{% block body %}
<main class="login-page login-centered">
  <section class="login-card">
    <a class="login-brand" href="{{ url_for('public.home') }}" aria-label="Voltar ao site">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Stylo Drywall">
    </a>
    <span class="eyebrow dark">ÁREA RESTRITA</span>
    <h1>Bem-vindo</h1>
    <p>Entre com suas credenciais para acessar o painel administrativo.</p>
    <form method="post" novalidate>
      {{ form.hidden_tag() }}
      <label>{{ form.username.label }}
        <div class="input-icon"><i class="bi bi-person"></i>{{ form.username(class_='input', placeholder='Digite seu usuário', autocomplete='username', autofocus=true) }}</div>
        {% for error in form.username.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
      </label>
      <label>{{ form.password.label }}
        <div class="input-icon"><i class="bi bi-lock"></i>{{ form.password(class_='input', placeholder='Digite sua senha', autocomplete='current-password') }}</div>
        {% for error in form.password.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
      </label>
      {{ form.submit(class_='btn gold wide login-submit') }}
    </form>
    <a href="{{ url_for('public.home') }}" class="login-back"><i class="bi bi-arrow-left"></i> Voltar ao site</a>
  </section>
</main>
{% endblock %}
